name: iOS Release Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Validate App Store Connect toolchain
        run: |
          python3 - <<'PY'
          import subprocess
          import re
          import sys

          xcode = subprocess.check_output(["xcodebuild", "-version"], text=True)
          sdk = subprocess.check_output(
              ["xcrun", "--sdk", "iphoneos", "--show-sdk-version"],
              text=True
          ).strip()

          xcode_match = re.search(r"Xcode\s+(\d+)(?:\.(\d+))?", xcode)
          if not xcode_match:
              print("Unable to parse Xcode version:", xcode)
              sys.exit(1)

          xcode_major = int(xcode_match.group(1))
          sdk_major = int(sdk.split(".")[0])

          print(xcode.strip())
          print("iPhoneOS SDK:", sdk)

          if xcode_major < 26:
              print("App Store Connect currently requires Xcode 26 or later.")
              sys.exit(1)

          if sdk_major < 26:
              print("App Store Connect currently requires the iOS 26 SDK or later.")
              sys.exit(1)
          PY

      - name: Validate release contract
        run: |
          plutil -lint CapturePilot/Info.plist
          plutil -lint CapturePilot/CapturePilot.entitlements
          plutil -lint CapturePilot/PrivacyInfo.xcprivacy
          python3 Tests/validate-release-contract.py

      - name: Run LUT recommendation tests
        run: Tests/run-lut-recommendation-tests.sh

      - name: Build Release for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project CapturePilot.xcodeproj \
            -target CapturePilot \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Build Release for iPhoneOS
        run: |
          set -o pipefail
          xcodebuild \
            -project CapturePilot.xcodeproj \
            -target CapturePilot \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build
