name: iOS Release Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Validate release contract
        run: |
          plutil -lint CapturePilot/Info.plist
          plutil -lint CapturePilot/CapturePilot.entitlements
          plutil -lint CapturePilot/PrivacyInfo.xcprivacy
          python3 Tests/validate-release-contract.py

      - name: Run LUT recommendation tests
        run: Tests/run-lut-recommendation-tests.sh

      - name: Build Release for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project CapturePilot.xcodeproj \
            -target CapturePilot \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Build Release for iPhoneOS
        run: |
          set -o pipefail
          xcodebuild \
            -project CapturePilot.xcodeproj \
            -target CapturePilot \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build
